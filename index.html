<!DOCTYPE html>
<html>
<head>
  <title>GeoCollab-IA Demo - Anotación Asíncrona</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>

  <!-- Tus scripts -->
  <script src="anotacion-persistencia.js"></script>

  <!-- Nuevo: gráfico 3D de barras -->
  <script src="barchart-3d.js"></script>
  <script src="terrain-3d.js"></script>
  <script src="points-3d.js"></script>
  <script src="terrain-wire.js"></script>
  <script src="viz-panel.js"></script>
  <!-- Multiusuario (avatares): Socket.IO client + componente -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="avatars-sync.js"></script>
</head>
<body>
  <a-scene anotacion-persistencia>
    <a-entity id="playerRig" movement-controls="fly: false; speed: 0.9">
      <a-entity id="rigCamera"
                camera
                look-controls
                position="0 1.6 0"
                raycaster="objects: .collidable; far: 20; recursive: true; linePrecision: 0.1">
        <a-cursor></a-cursor>
      </a-entity>

      

      <a-entity id="rightHand"
                laser-controls="hand: right"
                cursor="rayOrigin: entity"
                raycaster="objects: .vr-author-key, .viz-option, .collidable; far: 20; recursive: true; linePrecision: 0.1"
                line="color: #00FFFF">
      </a-entity>

      <a-entity id="leftHand"
                laser-controls="hand: left"
                cursor="rayOrigin: entity"
                raycaster="objects: .vr-author-key, .viz-option, .collidable; far: 20; recursive: true; linePrecision: 0.1"
                line="color: #00FFFF">
      </a-entity>
    </a-entity>

    <!-- Tablero fijo en el mundo, detrás de la posición inicial del jugador -->
    <a-entity id="backBoard" position="0 1.6 10" rotation="0 180 0">
      <a-entity geometry="primitive: plane; width: 1.8; height: 0.7"
                material="color: #0f172a; opacity: 0.9; side: double"></a-entity>
      <a-text value="Movilidad y logistica urbana" color="#e2f3ff" width="3.2" align="center" position="0 0.18 0.01"></a-text>
      <a-text id="backBoardMode" value="Barras: Volumen por Zona×Franja" color="#9bb3cc" width="2.8" align="center" position="0 -0.08 0.01"></a-text>
    </a-entity>

    <a-sky color="#0b0f1a"></a-sky>

    <!-- Gráfico 3D: 5 filas x 7 columnas. Puedes moverlo/rotarlo como quieras -->
    <a-entity id="chart" class="collidable"
  barchart-3d="
    rows: 5; cols: 7;
    cellSize: 0.9; gap: 0.15;
    maxHeight: 3.5; yTicks: 6;
    minBarHeight: 0.12; debug: true;
    values: 3.2, 1.0, 2.5, 4.1, 5.0, 1.8, 0.6,
            2.7, 1.1, 1.9, 3.0, 2.2, 2.8, 4.6,
            0.3, 0.9, 1.4, 2.3, 3.7, 4.2, 5.0,
            5.0, 4.4, 3.6, 2.1, 1.3, 0.5, 1.2,
            1.0, 2.6, 3.3, 4.8, 2.9, 1.7, 0.4;
  "
  position="-3 0 -7">
</a-entity>

    <a-entity viz-panel="chart: #chart; position: 30 100 -7"></a-entity>

    <!-- Superficie base por si quieres “anclar” anotaciones también -->
    <a-plane rotation="-90 0 0" width="20" height="20" color="#7BC8A4" class="collidable"></a-plane>

    <!-- Avatares multiusuario: transmite tu pose y muestra otros usuarios -->
    <a-entity avatars-sync="updateHz: 12; color: #7dd3fc; height: 1.7; radius: 0.18"></a-entity>
  </a-scene>

  <button id="guardar-btn"
          style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px; z-index: 9999;">
    Guardar Anotación Aquí
  </button>

  <!-- (Opcional) Borrar todas -->
  <button id="borrar-todo-btn"
          style="position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); padding: 10px; z-index: 9999;">
    Borrar TODAS las anotaciones
  </button>
</body>
</html>
